name: ci-okf

# Aeon's memory/topics/ directory is a native OKF (Open Knowledge Format) v0.1
# knowledge bundle: every concept file must carry a non-empty `type:` frontmatter
# field (OKF §9). Agents are non-deterministic, so some run WILL eventually drop
# the `type:` line — this workflow fails any PR that leaves the bundle non-conformant
# before it can rot silently.
#
# The validator (scripts/okf-validate.mjs) enforces ONLY the spec's hard bar (§9):
# it does NOT reject unknown types, missing optional fields, or broken links — that
# over-conformance would fight Aeon's own agents. See docs/OKF.md.
#
# Same shape/permissions as ci-skills-json.yml.
#
# The root globs are '<root>/**.md', not '<root>/**', on purpose. okf-validate
# walks ONLY markdown (scripts/lib/okf.mjs: `e.name.endsWith('.md')`), so a
# change to a JSON/CSV/image file under a root cannot alter the result. On a
# live agent instance those non-markdown writes dominate: the agent rewrites
# memory/cron-state.json, memory/*.json and memory/token-usage.csv on nearly
# every run. Measured on aeon-vuln, 63% of this workflow's push triggers
# touched no .md in scope at all - pure no-op jobs, each billed a full minute
# on a private fork. Narrowing to .md drops those with zero loss of coverage.
on:
  pull_request:
    paths:
      - 'memory/**.md'
      - 'output/articles/**.md'
      - 'skills/**.md'
      - 'docs/**.md'
      - 'scripts/okf-validate.mjs'
      - 'scripts/okf-index.mjs'
      - 'scripts/okf-config.json'
      - '.github/workflows/ci-okf.yml'
  push:
    branches: [main]
    paths:
      - 'memory/**.md'
      - 'output/articles/**.md'
      - 'skills/**.md'
      - 'docs/**.md'
      - 'scripts/okf-validate.mjs'
      - 'scripts/okf-index.mjs'
      - 'scripts/okf-config.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate OKF conformance (roots in scripts/okf-config.json)
        run: node scripts/okf-validate.mjs
