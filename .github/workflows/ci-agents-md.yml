name: ci-agents-md

# AGENTS.md is the non-claude harnesses' copy of the operating manual: CLAUDE.md
# with its `@imports` (e.g. `@STRATEGY.md`) expanded inline, generated by
# scripts/gen-agents-md.js. Those harnesses (grok/codex/pi/vibe/kimi) load
# instruction files verbatim and can't expand Claude Code @imports, so they read
# AGENTS.md; claude reads CLAUDE.md directly. This workflow fails any PR that edits
# CLAUDE.md, STRATEGY.md, or the generator without regenerating AGENTS.md, so the
# two copies can't silently drift.
#
# Regenerate locally with: node scripts/gen-agents-md.js

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'STRATEGY.md'
      - 'AGENTS.md'
      - 'scripts/gen-agents-md.js'
      - '.github/workflows/ci-agents-md.yml'
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'STRATEGY.md'
      - 'AGENTS.md'
      - 'scripts/gen-agents-md.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check AGENTS.md is regenerated from STRATEGY.md
        run: node scripts/gen-agents-md.js --check
